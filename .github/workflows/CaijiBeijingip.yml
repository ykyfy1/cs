name: CaijiBeijingip
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    #timeout-minutes: 360  # 控制运行时间
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装系统依赖(bc,sed等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc openssl || true
          bc --version || true

      - name: 安装python依赖
        run: |
          pip install aiohttp
          pip install -r requirements.txt

      # 提前创建脚本需要的目录
      - name: 创建输出目录
        run: |
          mkdir -p txt logs ip template

      # ==========【新增：扫描前清空ip目录旧good_*文件，防止残留干扰测速】==========
      - name: 清理ip目录历史good_*旧文件
        run: |
          rm -f ip/good_*.txt
          rm -f ip/组播_*.txt
          echo "✅ 已清理 ip/ 目录下旧的 good_*.txt 与 组播_*.txt"
      # =====================================================================

      # 清理7天前旧日志
      - name: 清理7天前旧日志
        run: |
          find logs -type f -name "scan_*.log" -mtime +7 -delete
          echo "✅ 已删除logs目录下7天前的日志文件"

      # 清理txt目录过期结果文件
      - name: 清理txt目录过期结果文件
        run: |
          find txt -type f -name "*.txt" -mtime +7 -delete
          echo "✅ 已删除txt目录下7天前的txt结果文件"

      - name: 运行采集+测速脚本（全部合并、加密、明文备份交给sh处理）
        run: |
          export ZUBO_PASSWORD="${ZUBO_PASSWORD}"
          cd $GITHUB_WORKSPACE
          
          # 运行Python扫描
          python ./CaijiBeijingip.py
          # 执行sh批量模式 0，sh内部完成全部城市合并、生成zubo.txt、备份zubo_plain_backup.txt、加密、删除zubo.txt
          bash ./CaijiBeijingip.sh 0

          echo "====调试输出===="
          wc -l txt/*.txt
          ls -la zubo*
        env:
          ZUBO_PASSWORD: ${{ secrets.ZUBO_PASSWORD }}

      - name: 上传扫描结果&日志到Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ github.run_id }}
          path: |
            txt/
            logs/
            ip/
            zubo_plain_backup.txt
            zubo.enc
          retention-days: 7

      # 文件校验恢复完成之后，再执行git add
      - name: 更新源（文件变更才提交，无变化直接跳过）
        run: |
          cd $GITHUB_WORKSPACE
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git reset HEAD .

          # 判断仓库变更，只提交zubo.enc，明文不会提交仓库
          if [[ -n $(git status --porcelain zubo.enc txt/ ip/ logs/) ]]; then
            echo "✅ 源文件检测到更新，准备提交"
            git add zubo.enc
            git add txt/
            git add ip/
            git add logs/
            if [[ -n $(git status --porcelain) ]]; then
              git commit -m "🤖 GitHub Actions自动更新多城市源 ${{ github.run_id }}"
              git push
            else
              echo "✅ git无变更，跳过提交"
            fi
          else
            echo "ℹ️ 文件无更新，跳过git提交"
          fi
