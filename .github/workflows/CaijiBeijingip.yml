name: CaijiBeijingip
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    #timeout-minutes: 360  # 控制运行时间
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装系统依赖(bc,sed等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc zip openssl || true
          bc --version || true

      - name: 安装python依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 【运行前清理旧的good_*文件，防止旧IP干扰】
        run: |
          rm -f good_*.txt

      - name: 执行Python扫描脚本
        run: |
          python scan.py

      - name: 执行Bash测速脚本
        run: |
          chmod +x speed.sh
          bash speed.sh

      - name: 打包并加密txt目录生成zubo.enc，加密完成删除明文txt
        run: |
          # 打包txt目录为zip
          zip -r txt_backup.zip txt/
          # openssl aes256加密，密码用仓库secrets里 ZUBO_ENC_PASS
          openssl enc -aes-256-cbc -salt -in txt_backup.zip -out zubo.enc -k ${{ secrets.ZUBO_ENC_PASS }}
          # =========核心：加密完成直接删除明文txt文件夹，虚拟机内销毁明文=========
          rm -rf txt/
          rm -f txt_backup.zip

      - name: 更新源（文件变更才提交，无变化直接跳过）
        run: |
          cd $GITHUB_WORKSPACE
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git reset HEAD .
          
          # 只提交zubo.enc ip logs，txt已经在虚拟机删除，不会上传明文！
          if [[ -n $(git status --porcelain zubo.enc ip/ logs/) ]]; then
            echo "✅ 源文件检测到更新，准备提交"
            git add zubo.enc
            git add ip/
            git add logs/
            if [[ -n $(git status --porcelain) ]]; then
              git commit -m "🤖 GitHub Actions自动更新多城市源 ${{ github.run_id }}"
              git push
            else
              echo "✅ git无变更，跳过提交"
            fi
          else
            echo "ℹ️ 文件无更新，跳过git提交"
          fi
