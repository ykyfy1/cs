name: CaijiBeijingip
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    #timeout-minutes: 360  # 控制运行时间
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装系统依赖(bc,sed,zip,openssl等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc zip openssl || true
          bc --version || true

      - name: 安装python依赖
        run: |
          pip install aiohttp
          pip install -r requirements.txt

      # 提前创建脚本需要的目录
      - name: 创建输出目录
        run: |
          mkdir -p txt logs ip template

      # 清理ip目录历史旧文件
      - name: 清理ip目录历史旧文件
        run: |
          rm -f ip/good_*.txt
          rm -f ip/组播_*.txt
          echo "✅ 已清理 ip/ 目录旧文件"

      # 清理旧日志
      - name: 清理7天前旧日志
        run: |
          find logs -type f -name "scan_*.log" -mtime +7 -delete
          echo "✅ 清理过期日志"

      # 采集测速、拼接生成zubo.txt、zubo.m3u
      - name: 获取源 + 多城市测速处理
        run: |
          export ZUBO_PASSWORD="${ZUBO_PASSWORD}"
          cd $GITHUB_WORKSPACE
          # 备份旧zubo.txt
          if [ -f "zubo.txt" ] && [ -s "zubo.txt" ]; then
            cp zubo.txt zubo_bf.txt
            echo "✅ 备份旧zubo.txt"
          else
            rm -f zubo_bf.txt
            touch zubo_bf.txt
          fi
          
          # 执行采集脚本
          python ./CaijiBeijingip.py
          bash ./CaijiBeijingip.sh 0

          # 拼接城市txt
          > zubo.txt
          city_list=(
            "txt/Beijing_dianxin.txt"
            "txt/Shanghai_dianxin.txt"
            #"txt/Guangzhou_dianxin.txt"
          )
          for f in "${city_list[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              cat "$f" >> zubo.txt
              echo "✅ 拼接：$f"
            fi
          done
          if [ ! -s zubo.txt ]; then
            echo "# 暂无测速IP数据" > zubo.txt
          fi

          # 校验文件，空就回滚备份
          NEW_ZUBO="./zubo.txt"
          if [ ! -f "$NEW_ZUBO" ] || [ ! -s "$NEW_ZUBO" ]; then
            echo "⚠️ zubo.txt为空，恢复备份"
            if [ -f "zubo_bf.txt" ] && [ -s "zubo_bf.txt" ]; then
              cp zubo_bf.txt zubo.txt
            fi
          fi
          
          echo "====行数调试===="
          wc -l txt/*.txt
          wc -l zubo.txt

          # 生成CF部署用的m3u和index.html
          cp zubo.txt zubo.m3u
          echo "<pre>IPTV源：<a href='./zubo.m3u'>zubo.m3u</a></pre>" > index.html
          echo "✅ 生成zubo.m3u 和 index.html"
        env:
          ZUBO_PASSWORD: ${{ secrets.ZUBO_PASSWORD }}

      # 部署到Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=iptv

      # 加密zubo.txt，加密完成删除明文
      - name: 加密zubo.txt生成zubo.enc
        run: |
          log_print() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }
          if [ -f "zubo.txt" ] && [ -s "zubo.txt" ]; then
            log_print "开始加密zubo.txt"
            openssl enc -aes-256-cbc -salt -in zubo.txt -out zubo.enc -k "$ZUBO_PASSWORD"
            if [ $? -eq 0 ] && [ -f "zubo.enc" ] && [ -s "zubo.enc" ]; then
              log_print "✅ 加密成功，删除明文zubo.txt"
              rm -f zubo.txt
            else
              log_print "❌ 加密失败，保留明文"
            fi
          else
            log_print "跳过加密，zubo.txt不存在或为空"
          fi
        env:
          ZUBO_PASSWORD: ${{ secrets.ZUBO_PASSWORD }}

      # 打包加密整个txt目录，加密后删除txt文件夹
      - name: 打包加密txt目录全部城市文件
        run: |
          log_print() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }
          if [ -d "txt" ] && [ -n "$(ls -A txt)" ]; then
            log_print "打包txt目录"
            zip -r txt_backup.zip txt/
            openssl enc -aes-256-cbc -salt -in txt_backup.zip -out txt_all.enc -k "$ZUBO_PASSWORD"
            if [ $? -eq 0 ] && [ -f "txt_all.enc" ] && [ -s "txt_all.enc" ]; then
              log_print "✅ 打包加密成功，删除txt明文文件夹"
              rm -rf txt/
              rm -f txt_backup.zip
            else
              log_print "❌ txt加密失败，保留txt文件夹"
            fi
          else
            log_print "txt目录为空，跳过打包"
          fi
        env:
          ZUBO_PASSWORD: ${{ secrets.ZUBO_PASSWORD }}

      # Git提交更新后的加密文件
      - name: 提交更新加密文件
        run: |
          cd $GITHUB_WORKSPACE
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git reset HEAD .
          if [[ -n $(git status --porcelain zubo.enc txt_all.enc ip/ logs/) ]]; then
            echo "✅ 检测到文件更新，准备提交"
            git add zubo.enc
            git add txt_all.enc
            git add ip/
            git add logs/
            if [[ -n $(git status --porcelain) ]]; then
              git commit -m "🤖自动更新 ${{ github.run_id }}"
              git push
            fi
          else
            echo "ℹ️ 文件无变更，跳过提交"
          fi
