name: CaijiBeijingip
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    # 可选：设置job最长运行时间，防止卡死
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装系统依赖(bc,sed等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc || true
          bc --version || true

      - name: 安装python依赖
        run: |
          pip install aiohttp
          pip install -r requirements.txt

      # 提前创建脚本需要的目录
      - name: 创建输出目录
        run: |
          mkdir -p txt logs ip template

      # 新增：自动清理7天前的旧日志
      - name: 清理7天前旧日志
        run: |
          find logs -type f -name "scan_*.log" -mtime +7 -delete
          echo "✅ 已删除logs目录下7天前的日志文件"

      # 新增：清理txt目录超过7天的旧结果文件
      - name: 清理txt目录过期结果文件
        run: |
          find txt -type f -name "*.txt" -mtime +7 -delete
          echo "✅ 已删除txt目录下7天前的txt结果文件"

      # =========【多城市版本 + 文件保护：失败不覆盖zubo.txt】=========
      - name: 获取源 + 多城市测速处理
        run: |
          cd $GITHUB_WORKSPACE
          python ./CaijiBeijingip.py
          cat zubo.txt > zubo_bf.txt
          bash ./CaijiBeijingip.sh 0
          # 校验合并结果文件，存在且非空才覆盖zubo.txt
          MERGE_FILE="txt/all_city_sorted.txt"
          if [ -f "$MERGE_FILE" ] && [ -s "$MERGE_FILE" ]; then
            echo "✅ 全局合并文件正常，更新zubo.txt"
            cat "$MERGE_FILE" > zubo.txt
          else
            echo "⚠️ 警告：$MERGE_FILE 不存在或者是空文件！不覆盖zubo.txt，保留旧源！"
          fi

      - name: 上传扫描结果&日志到Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ github.run_id }}
          path: |
            txt/
            logs/
            ip/
          retention-days: 7

      - name: 更新源（文件变更才提交，无变化直接跳过）
        run: |
          cd $GITHUB_WORKSPACE
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 对比新zubo.txt 和备份 zubo_bf.txt，内容相同则标记无需提交
          if diff -q zubo.txt zubo_bf.txt >/dev/null ; then
            echo "ℹ️ 新源与旧源内容完全一致，无需提交，直接结束"
          else
            echo "✅ 源文件检测到更新，准备提交"
            git add .
            if [[ -n $(git status --porcelain) ]]; then
              git commit -m "🤖 GitHub Actions自动更新多城市源 ${{ github.run_id }}"
              git push
            else
              echo "✅ git无变更，跳过提交"
            fi
          fi
